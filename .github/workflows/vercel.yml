name: Deploy developV3 to Vercel

on:
  push:
    branches:
      - developV3

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel
        
      - name: Install PNPM CLI
        run: npm install -g pnpm

      - name: Link Vercel Project
        run: vercel link --yes --project=manga-haven-v3 --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Production
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deployment notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Successfully deployed to Vercel and promoted to production!"
            echo "🌐 URL: ${{ env.DEPLOYMENT_URL }}"
          else
            echo "❌ Deployment failed"
          fi