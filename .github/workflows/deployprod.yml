name: Deploy to Production

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          build-args: |
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_GITHUB_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GITHUB_CLIENT_ID }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mangaheaven:latest
            ${{ secrets.DOCKER_USERNAME }}/mangaheaven:${{ github.sha }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Change to project directory
            cd /home/${{ secrets.SERVER_USERNAME }}/mangaheaven
            
            # Pull the latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/mangaheaven:latest
            
            # Stop and remove old container
            docker stop mangaheaven || true
            docker rm mangaheaven || true
            
            # Run new container with environment variables from GitHub Secrets
            docker run -d \
              --name mangaheaven \
              --restart unless-stopped \
              -p 3000:3000 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}" \
              -e NEXTAUTH_URL="${{ secrets.NEXTAUTH_URL }}" \
              -e NEXT_PUBLIC_GOOGLE_CLIENT_ID="${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}" \
              -e NEXT_GOOGLE_CLIENT_SECRET="${{ secrets.NEXT_GOOGLE_CLIENT_SECRET }}" \
              -e NEXT_PUBLIC_GITHUB_CLIENT_ID="${{ secrets.NEXT_PUBLIC_GITHUB_CLIENT_ID }}" \
              -e NEXT_GITHUB_CLIENT_SECRET="${{ secrets.NEXT_GITHUB_CLIENT_SECRET }}" \
              -e NEXT_CLOUDINARY_CLOUD_NAME="${{ secrets.NEXT_CLOUDINARY_CLOUD_NAME }}" \
              -e NEXT_CLOUDINARY_API_KEY="${{ secrets.NEXT_CLOUDINARY_API_KEY }}" \
              -e NEXT_CLOUDINARY_API_SECRET="${{ secrets.NEXT_CLOUDINARY_API_SECRET }}" \
              -e NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}" \
              -e NEXT_PUBLIC_SITE_URL="${{ secrets.NEXT_PUBLIC_SITE_URL }}" \
              -e NODE_ENV="production" \
              -e PORT="3000" \
              ${{ secrets.DOCKER_USERNAME }}/mangaheaven:latest
            
            # Clean up old images
            docker image prune -af

      - name: Send deployment notification
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            console.log(`${emoji} Deployment ${status} for commit ${context.sha.substring(0, 7)}`);

